<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ninja Legends</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    canvas {
      background: #222;
      display: block;
      margin: 0 auto;
      border: 2px solid #444;
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      background: #e53935;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #ff5252;
    }
  </style>
</head>
<body>

<h2>Ninja Legends</h2>

<canvas id="game" width="600" height="400"></canvas>

<div id="ui">
  <button onclick="goVillage()">🏠 Aldeia</button>
  <button onclick="train()">🌾 Treinar</button>
  <button onclick="startBattle()">⚔️ Batalha</button>
  <button onclick="startDuel()">🤺 Duelo</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let scene = "village";

// Player
let player = {
  name: "Ninja",
  level: 1,
  xp: 0,
  xpMax: 100,
  hp: 100,
  maxHp: 100,
  attack: 15,
  gold: 50
};

// Enemy template
function createEnemy() {
  return {
    name: "Bandido",
    hp: 80,
    attack: 12
  };
}

let enemy = null;

// ===================
// SCENES
// ===================
function goVillage() {
  scene = "village";
}

function train() {
  scene = "train";
  player.xp += 20;
  player.gold += 10;

  if (player.xp >= player.xpMax) {
    player.level++;
    player.xp = 0;
    player.xpMax += 50;
    player.maxHp += 20;
    player.attack += 5;
    player.hp = player.maxHp;
  }
}

function startBattle() {
  enemy = createEnemy();
  scene = "battle";
}

function startDuel() {
  enemy = {
    name: "Ninja Rival",
    hp: 120,
    attack: 18
  };
  scene = "battle";
}

// ===================
// BATTLE
// ===================
function attackEnemy() {
  enemy.hp -= player.attack;
  if (enemy.hp <= 0) {
    player.gold += 30;
    player.xp += 40;
    scene = "village";
    return;
  }

  player.hp -= enemy.attack;
  if (player.hp <= 0) {
    player.hp = player.maxHp;
    scene = "village";
  }
}

// ===================
// DRAW
// ===================
function drawVillage() {
  ctx.fillStyle = "#2e7d32";
  ctx.fillRect(0, 0, 600, 400);
  ctx.fillStyle = "#fff";
  ctx.fillText("🏠 Aldeia Ninja", 240, 50);
}

function drawTrain() {
  ctx.fillStyle = "#1565c0";
  ctx.fillRect(0, 0, 600, 400);
  ctx.fillStyle = "#fff";
  ctx.fillText("🌾 Treinando...", 240, 200);
}

function drawBattle() {
  ctx.fillStyle = "#4e342e";
  ctx.fillRect(0, 0, 600, 400);

  ctx.fillStyle = "#fff";
  ctx.fillText("⚔️ Batalha", 260, 30);

  ctx.fillText(`Você HP: ${player.hp}`, 50, 100);
  ctx.fillText(`${enemy.name} HP: ${enemy.hp}`, 350, 100);

  ctx.fillRect(250, 300, 100, 40);
  ctx.fillStyle = "#000";
  ctx.fillText("Atacar", 275, 325);
  ctx.fillStyle = "#fff";
}

canvas.addEventListener("click", (e) => {
  if (scene === "battle") {
    const x = e.offsetX;
    const y = e.offsetY;
    if (x > 250 && x < 350 && y > 300 && y < 340) {
      attackEnemy();
    }
  }
});

function drawHUD() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 360, 600, 40);
  ctx.fillStyle = "#fff";
  ctx.fillText(
    `Lvl ${player.level} | HP ${player.hp}/${player.maxHp} | XP ${player.xp}/${player.xpMax} | 💰 ${player.gold}`,
    10,
    385
  );
}

// ===================
// LOOP
// ===================
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (scene === "village") drawVillage();
  if (scene === "train") drawTrain();
  if (scene === "battle") drawBattle();

  drawHUD();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
